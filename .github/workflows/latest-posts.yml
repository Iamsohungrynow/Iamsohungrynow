# Keeps "Latest from the High Entropy Diary" in README.md in step with highentropy001.com.
name: Latest posts

on:
  schedule:
    - cron: "0 0 * * *" # daily, 08:00 Singapore time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://highentropy001.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "d mmm yyyy"
          commit_message: "Update latest posts from highentropy001.com"
