# Keeps "Latest from the High Entropy Diary" in README.md in step with highentropy001.com.
name: Latest posts

on:
  schedule:
    - cron: "0 0 * * *" # daily, 08:00 Singapore time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/latest-posts.mjs
      - name: Commit if the list changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update latest posts from highentropy001.com"
          git push
